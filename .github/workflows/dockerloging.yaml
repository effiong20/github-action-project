name: docker auth project
on: push
jobs:
    job-one:
        runs-on: ubuntu-latest
        steps:
         -   name: clone sources code
             uses: actions/checkout@v6

         -   name: dockerhub_login
             uses: docker/login-action@v4
             with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }} 
           
         -   name: Build and push
             uses: docker/build-push-action@v7
             with:
                context: .
                push: true
                tags: giftedid/app:v1.1.0
              
         -   name: Run container image
             run: docker run -d -p 5000:5000 --name my_sample_app  giftedid/app:v1.1.0
            
         -   name: Smoke test
             run: | 
              sleep 5
              curl http://localhost:5000   
                    
                    
